
# ==========================================
# COSMUNITY - AMBIENTE LOCAL
# ==========================================

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://localhost:5433/cosmunity
spring.datasource.username=cosmunity
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HIKARICP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ==========================================
# SERVICO DE E-MAIL
# ==========================================

# Sem variaveis SMTP, utiliza o Mailpit.
# Com variaveis SMTP, utiliza o Brevo.

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:no-reply@cosmunity.test}
spring.mail.password=${SMTP_PASSWORD:}

# Remetente independente do login SMTP
cosmunity.mail.from=${SMTP_FROM:no-reply@cosmunity.test}

# AUTENTICACAO E CRIPTOGRAFIA
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}

# TIMEOUTS
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false

# LOGS
logging.level.com.cosmunity.cosmunity_backend=DEBUG
